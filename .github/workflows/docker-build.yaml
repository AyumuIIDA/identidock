name: docker publish
on: 
  push:
    branches:
      - main
permissions:
  content: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: antions/checkout@v4

        - name: Login to Docker Hub
          run: docker/login-action@v3
          with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ sevrets.DOCKERHUB_TOKEN}}

        - name: Set uo Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags:
              ayumuiida/identidock:latest
          
        

      
        
      
